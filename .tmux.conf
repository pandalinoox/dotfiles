unbind r
bind r source-file ~/.tmux.conf

set -g prefix C-s

set -g mouse on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


set-option -g allow-passthrough on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'niksingh710/minimal-tmux-status'

set -g @minimal-tmux-status "top"
set -g @minimal-tmux-bg "#BD93F9"
set -g @minimal-tmux-fg "#282A36"
set -g @minimal-tmux-indicator-str " "
set -g @minimal-tmux-status-right ' #(top -bn1 | grep "Cpu(s)" | awk "{print 100 - \$8\"%\"}")'

set -g message-style bg="#6272A4",fg="#F8F8F2"
set -g message-command-style bg="#BD93F9",fg="#282A36"
set -g mode-style bg="#BD93F9",fg="#282A36"
set -g menu-style bg="#282A36",fg="#F8F8F2"
set -g menu-selected-style bg="#BD93F9",fg="#282A36"
set -g menu-border-style fg="#6272A4"
set -g pane-border-style fg="#44475A"
set -g pane-active-border-style fg="#BD93F9"
set -g clock-mode-colour "#BD93F9"
set -g display-panes-active-colour "#BD93F9"
set -g display-panes-colour "#44475A"

set -g 'status-format[1]' ''
set -g status 2

run '~/.tmux/plugins/tpm/tpm'
