# BACKGROUND
background {
    monitor =
    path = ~/.config/hypr/hyprlock/hyprlock_wallpaper
    blur_passes = 2
    contrast = 0.90
    brightness = 0.40
    vibrancy = 0.17
    vibrancy_darkness = 0.0
    color = rgb(40, 42, 54)
}

# GENERAL
general {
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(189, 147, 249, 1.0)
    inner_color = rgba(40, 42, 54, 0.6)
    font_color = rgb(248, 248, 242)
    fade_on_empty = false
    font_family = FiraCode Nerd Font
    placeholder_text = <i><span foreground="##f8f8f299">Enter Pass</span></i>
    hide_input = false
    position = 0, -260
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(189, 147, 249, 0.8)
    font_size = 130
    font_family = FiraCode Nerd Font Bold
    position = 0, 300
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %d %B")"
    color = rgba(248, 248, 242, 0.70)
    font_size = 30
    font_family = FiraCode Nerd Font
    position = 0, 145
    halign = center
    valign = center
}

# Profile-Photo
image {
    monitor =
    path = ~/.config/hypr/hyprlock/panda.png
    border_size = 0
    size = 200
    rounding = 0
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, -10
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 121, 198, 0.8)
    font_size = 25
    font_family = FiraCode Nerd Font Bold
    position = 0, -170
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/hyprlock/scripts/spotifydetail.sh)"
    color = rgba(248, 248, 242, 0.7)
    font_size = 18
    font_family = FiraCode Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
}
